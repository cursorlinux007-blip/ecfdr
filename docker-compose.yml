version: '3.8'

services:
  db:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: erpnext
      MYSQL_USER: erpnext
      MYSQL_PASSWORD: erpnext
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  backend:
    image: frappe/erpnext:v15.0.0
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=erpnext
      - DB_USER=erpnext
      - DB_PASSWORD=erpnext
      - REDIS_CACHE=redis://redis:6379
      - REDIS_QUEUE=redis://redis:6379
      - REDIS_SOCKETIO=redis://redis:6379
      - SOCKETIO_PORT=9000
      - AUTO_MIGRATE=1
      - WEB_PORT=8000
      - SITES=erpnext.localhost
      - DEVELOPER_MODE=1
    volumes:
      - sites_data:/home/frappe/frappe-bench/sites
      - ./csf_do:/tmp/csf_do:ro
      - ./docker-install-ecfdr.sh:/tmp/docker-install.sh:ro
    ports:
      - "8000:8000"
      - "9000:9000"
    depends_on:
      - db
      - redis
    command: >
      bash -c "
        if [ ! -d '/home/frappe/frappe-bench/apps/csf_do' ]; then
          echo 'Instalando ECFDR...';
          chmod +x /tmp/docker-install.sh;
          /tmp/docker-install.sh;
        fi;
        /home/frappe/frappe-bench/entrypoint.sh
      "

  frontend:
    image: frappe/erpnext:v15.0.0
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=erpnext
      - DB_USER=erpnext
      - DB_PASSWORD=erpnext
      - REDIS_CACHE=redis://redis:6379
      - REDIS_QUEUE=redis://redis:6379
      - REDIS_SOCKETIO=redis://redis:6379
      - SOCKETIO_PORT=9000
      - AUTO_MIGRATE=1
      - WEB_PORT=8000
      - SITES=erpnext.localhost
      - DEVELOPER_MODE=1
    volumes:
      - sites_data:/home/frappe/frappe-bench/sites
      - ./csf_do/csf_do/public:/home/frappe/frappe-bench/sites/assets/csf_do:ro
    ports:
      - "8001:8000"
    depends_on:
      - db
      - redis
      - backend

volumes:
  db_data:
  sites_data:
